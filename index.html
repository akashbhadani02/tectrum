<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="icon" href="/favicon.ico" sizes="any" type="image/x-icon">
    <link rel="icon" href="/img/favicon.png" sizes="64x64" type="image/png">
    <link rel="apple-touch-icon" href="/img/icon-192.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Lead Follow-up">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Lead Follow-up Manager</title>
    <meta name="theme-color" content="#2563eb">
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033
        }

        header {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px
        }

        h1 {
            margin: 0;
            font-size: 22px
        }

        .wrap {
            padding: 20px;
            max-width: 1500px;
            margin: auto
        }

        .toolbar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            background: #2563eb;
            color: #fff;
            font-weight: 600
        }

        button.gray {
            background: #64748b
        }

        button.green {
            background: #16a34a
        }

        .card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            overflow: auto
        }

        input,
        select {
            padding: 9px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #fff
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1400px
        }

        th,
        td {
            padding: 9px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            font-size: 13px;
            white-space: nowrap
        }

        th {
            background: #f1f5f9;
            position: sticky;
            top: 0
        }

        .filter {
            width: 100%;
            min-width: 100px
        }

        .next-followup-calendar { position: relative; min-width: 190px; }
        .date-filter-trigger { width: 100%; min-height: 34px; padding: 6px 8px; border: 1px solid #94a3b8; border-radius: 6px; background: #f8fafc; color: #0f172a; cursor: pointer; text-align: left; font-size: 12px; font-weight: 500; }
        .date-filter-trigger:hover { background: #eef2ff; border-color: #6366f1; }
        .date-filter-popup { position: absolute; z-index: 1000; top: calc(100% + 4px); left: 0; width: 290px; padding: 12px; background: #ffffff; border: 1px solid #94a3b8; border-radius: 10px; box-shadow: 0 12px 32px rgba(15,23,42,.22); }
        .date-filter-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; padding:7px 8px; background:#1e3a8a; border-radius:7px; color:#fff; }
        .date-filter-head button { border:1px solid #bfdbfe; background:#ffffff; color:#1e3a8a; border-radius:5px; padding:3px 9px; cursor:pointer; font-weight:700; }
        .date-filter-head button:hover { background:#dbeafe; }
        .date-filter-title { font-weight:700; font-size:13px; color:#fff; }
        .date-filter-week, .date-filter-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; }
        .date-filter-week { margin-bottom:3px; }
        .date-filter-week span { text-align:center; font-size:10px; font-weight:700; color:#334155; padding:4px 0; background:#e2e8f0; border-radius:4px; }
        .date-filter-day { border:1px solid #cbd5e1; background:#f1f5f9; color:#0f172a; border-radius:5px; padding:7px 0; font-size:11px; font-weight:600; cursor:pointer; }
        .date-filter-day:hover { background:#dbeafe; border-color:#60a5fa; color:#1e3a8a; }
        .date-filter-day.selected { background:#2563eb; border-color:#1d4ed8; color:#fff; box-shadow:0 0 0 2px #bfdbfe; }
        .date-filter-day.empty { visibility:hidden; pointer-events:none; }
        .date-filter-actions { display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:9px; border-top:1px solid #cbd5e1; }
        .date-filter-actions button { border:1px solid #94a3b8; background:#f8fafc; color:#0f172a; border-radius:5px; padding:5px 9px; cursor:pointer; font-size:11px; font-weight:600; }
        .date-filter-actions button:hover { background:#e2e8f0; }
        .date-filter-actions .set-date-filter { background:#2563eb; color:#fff; border-color:#2563eb; }
        .date-filter-actions .set-date-filter:hover { background:#1d4ed8; }
        .selected-date-count { margin-top: 3px; font-size: 10px; color: #475569; white-space: normal; line-height: 1.2; font-weight: 500; }

        .status {
            margin: 8px 0;
            padding: 10px;
            border-radius: 8px;
            background: #eef2ff
        }

        .error {
            background: #fee2e2;
            color: #991b1b
        }

        .ok {
            background: #dcfce7;
            color: #166534
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: #0008;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10
        }

        .modal.show {
            display: flex
        }

        .box {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            width: min(850px, 100%);
            max-height: 90vh;
            overflow: auto
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px
        }

        .grid label {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 13px;
            font-weight: 600
        }

        .actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px
        }

        @media(max-width:700px) {
            .grid {
                grid-template-columns: 1fr
            }

            header {
                padding: 14px
            }

            .wrap {
                padding: 12px
            }
        }
    
        .rowCheck, #selectAll { width:18px; height:18px; cursor:pointer; }
        th:first-child, td:first-child { text-align:center; }
        .toolbar button { white-space:nowrap; }
        
    </style>
</head>

<body>
    <header>
        <h1>Lead Follow-up Manager</h1>
        <div><button onclick="openImport()">Import Data</button> <button onclick="openAdd()">+ Add Lead</button></div>
    </header>
    <div class="wrap">
        <div id="status" class="status">Connecting...</div>
        <div class="toolbar">
            <button class="gray" onclick="toggleAllRows(true)">☑ Select All</button>
            <button onclick="deleteSelected()">Delete Selected</button>
            <input id="globalSearch" placeholder="Search all columns..." oninput="render()">
            <button class="gray" onclick="clearFilters()">Clear Filters</button>
            <button class="gray" onclick="exportCSV()">Export CSV</button>
        </div>
        <div class="card">
            <div style="margin-bottom:8px;font-size:13px;color:#475569"><b>☐</b> Select checkbox is placed before ID. Tick/untick individual rows or use Select All.</div>
            <div id="tableWrap"></div>
        </div>
    </div>

    <div id="leadModal" class="modal">
        <div class="box">
            <h2 id="modalTitle">Add Lead</h2>
            <div id="form" class="grid"></div>
            <div class="actions"><button class="gray" onclick="closeLead()">Cancel</button><button
                    onclick="saveLead()">Save</button></div>
        </div>
    </div>

    <div id="importModal" class="modal">
        <div class="box">
            <h2>Import Excel</h2>
            <!-- <p>Any Excel/CSV/JSON data can be imported. Column names do not have to match: known columns are auto-mapped and unknown/extra columns are preserved. Rows with missing ID are also imported and get a unique ID automatically. Blank rows are skipped. Same ID updates the existing record; new ID creates a record.</p> -->
            <input id="file" type="file" accept=".xlsx,.xls,.csv,.json">
            <div id="importMsg"></div>
            <div class="actions"><button class="gray" onclick="closeImport()">Cancel</button><button
                    onclick="importFile()">Import</button></div>
        </div>
    </div>

    <script>
        const API="/api/leads";
        const fields = ["id", "leadInDate", "clientName", "clientMobile", "architectName", "architectMobile", "salesPerson", "leadGivenBy", "quotation", "amount", "dealed", "hotLead", "address", "area", "currentStatus", "nextFollowUpDate"];
        const labels = { id: "ID", leadInDate: "Lead Date", clientName: "Client", clientMobile: "Client Mobile", architectName: "Architect", architectMobile: "Architect Mobile", salesPerson: "Sales Person", leadGivenBy: "Lead Given By", quotation: "Quotation", amount: "Amount", dealed: "Dealed", hotLead: "Hot Lead", address: "Address", area: "Area", currentStatus: "Current Status", nextFollowUpDate: "Next Follow-up" };
        let leads = [], editId = null, filters = {};
        // Keep row checkbox state while the table is re-rendered by live sync.
        const selectedIds = new Set();
        const pendingSelectionIds = new Set();
        let liveTimer = null;
        let isLoading = false;
        let lastDataSignature = "";
        const LIVE_REFRESH_MS = 750;
        const HIDDEN_REFRESH_MS = 5000;

        function dataSignature(data) {
            return JSON.stringify((data || []).map(x => ({
                id: x.id,
                leadInDate: x.leadInDate,
                clientName: x.clientName,
                clientMobile: x.clientMobile,
                architectName: x.architectName,
                architectMobile: x.architectMobile,
                salesPerson: x.salesPerson,
                leadGivenBy: x.leadGivenBy,
                quotation: x.quotation,
                amount: x.amount,
                dealed: x.dealed,
                hotLead: x.hotLead,
                address: x.address,
                area: x.area,
                currentStatus: x.currentStatus,
                nextFollowUpDate: x.nextFollowUpDate,
                selected: Boolean(x.selected),
                updatedAt: x.updatedAt,
                createdAt: x.createdAt
            })));
        }

        async function load(showStatus = true) {
            if (isLoading) return;
            isLoading = true;
            try {
                // Cache-buster + API no-cache headers make sure another user's changes are fetched.
                const data = await api(API + "?t=" + Date.now(), { cache: "no-store" });
                const signature = dataSignature(data);
                const changed = signature !== lastDataSignature;
                leads = data;
                lastDataSignature = signature;
                if (showStatus) setStatus("Connected", "ok");
                if (changed) render();
            } catch (e) {
                if (showStatus) setStatus("MongoDB/API error: " + e.message, "error");
            } finally {
                isLoading = false;
            }
        }

        function startLiveUpdates() {
            if (liveTimer) clearInterval(liveTimer);
            // Poll the shared MongoDB-backed API continuously so changes made by
            // any user/device appear on every other open device automatically.
            liveTimer = setInterval(() => {
                load(false);
            }, LIVE_REFRESH_MS);
        }

        document.addEventListener("visibilitychange", () => {
            if (!document.hidden) load(false);
        });
        window.addEventListener("focus", () => load(false));
        window.addEventListener("online", () => load(false));

        async function api(url, opt = {}) { const r = await fetch(url, opt); const text = await r.text(); let data = {}; try { data = JSON.parse(text) } catch { } if (!r.ok) throw new Error(data.error || text || ("HTTP " + r.status)); return data }
        function setStatus(t, c) { const s = document.getElementById("status"); s.textContent = t; s.className = "status " + c }
        function getVisibleRows() {
            const q = (document.getElementById("globalSearch")?.value || "").toLowerCase();
            return leads.filter(x =>
                fields.every(f => {
                    if (f === "nextFollowUpDate" && Array.isArray(filters[f])) {
                        const selectedDates = filters[f];
                        return selectedDates.length === 0 || selectedDates.includes(dateOnly(x[f]));
                    }
                    return String(x[f] ?? "").toLowerCase().includes(String(filters[f] || "").toLowerCase());
                }) &&
                fields.some(f => String(x[f] ?? "").toLowerCase().includes(q))
            );
        }

        function getNextFollowUpFilterOptions() {
            return [...new Set(
                leads
                    .map(x => dateOnly(x.nextFollowUpDate))
                    .filter(Boolean)
            )].sort();
        }

        function formatFilterDate(value) {
            if (!value) return "";
            const d = new Date(value + "T00:00:00");
            if (Number.isNaN(d.getTime())) return value;
            return d.toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit", year: "numeric" });
        }

        let followUpCalendarOpen = false;
        let followUpCalendarDraft = [];
        let followUpCalendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

        function calendarMonthLabel(d) {
            return d.toLocaleDateString("en-GB", { month: "long", year: "numeric" });
        }

        function renderFollowUpCalendar() {
            const selected = Array.isArray(followUpCalendarDraft) ? followUpCalendarDraft : [];
            const year = followUpCalendarMonth.getFullYear();
            const month = followUpCalendarMonth.getMonth();
            const first = new Date(year, month, 1);
            const days = new Date(year, month + 1, 0).getDate();
            const offset = (first.getDay() + 6) % 7;
            let cells = Array(offset).fill(`<button type="button" class="date-filter-day empty" tabindex="-1"></button>`).join("");
            for (let day = 1; day <= days; day++) {
                const value = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
                cells += `<button type="button" class="date-filter-day ${selected.includes(value) ? "selected" : ""}" onclick="toggleFollowUpCalendarDate('${value}')">${day}</button>`;
            }
            return `<div class="date-filter-popup" onclick="event.stopPropagation()">
                <div class="date-filter-head">
                    <button type="button" onclick="changeFollowUpCalendarMonth(-1)">‹</button>
                    <span class="date-filter-title">${esc(calendarMonthLabel(followUpCalendarMonth))}</span>
                    <button type="button" onclick="changeFollowUpCalendarMonth(1)">›</button>
                </div>
                <div class="date-filter-week"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
                <div class="date-filter-grid">${cells}</div>
                <div class="date-filter-actions">
                    <button type="button" onclick="clearFollowUpCalendarDraft()">Clear</button>
                    <span class="selected-date-count">${selected.length} selected</span>
                    <button type="button" class="set-date-filter" onclick="setFollowUpCalendarFilter()">Set</button>
                </div>
            </div>`;
        }

        function nextFollowUpFilterHtml() {
            const selected = Array.isArray(filters.nextFollowUpDate) ? filters.nextFollowUpDate : [];
            const label = selected.length ? selected.map(formatFilterDate).join(", ") : "Select date(s)";
            return `<div class="next-followup-calendar">
                <button type="button" class="date-filter-trigger" onclick="toggleFollowUpCalendar()">${esc(label)}</button>
                ${followUpCalendarOpen ? renderFollowUpCalendar() : ""}
                <div class="selected-date-count">${selected.length ? `${selected.length} date${selected.length === 1 ? "" : "s"} set` : "Select multiple dates, then click Set"}</div>
            </div>`;
        }

        function toggleFollowUpCalendar() {
            followUpCalendarOpen = !followUpCalendarOpen;
            if (followUpCalendarOpen) {
                followUpCalendarDraft = [...(Array.isArray(filters.nextFollowUpDate) ? filters.nextFollowUpDate : [])];
                const base = followUpCalendarDraft[0] ? new Date(followUpCalendarDraft[0] + "T00:00:00") : new Date();
                followUpCalendarMonth = new Date(base.getFullYear(), base.getMonth(), 1);
            }
            render();
        }

        function toggleFollowUpCalendarDate(value) {
            const i = followUpCalendarDraft.indexOf(value);
            if (i >= 0) followUpCalendarDraft.splice(i, 1);
            else followUpCalendarDraft.push(value);
            followUpCalendarDraft.sort();
            render();
        }

        function changeFollowUpCalendarMonth(delta) {
            followUpCalendarMonth = new Date(followUpCalendarMonth.getFullYear(), followUpCalendarMonth.getMonth() + delta, 1);
            render();
        }

        function clearFollowUpCalendarDraft() {
            followUpCalendarDraft = [];
            filters.nextFollowUpDate = [];
            followUpCalendarOpen = false;
            render();
        }

        function setFollowUpCalendarFilter() {
            filters.nextFollowUpDate = [...followUpCalendarDraft].sort();
            followUpCalendarOpen = false;
            updateRowsOnly();
            render();
        }

        document.addEventListener("click", (event) => {
            if (!followUpCalendarOpen) return;
            if (!event.target.closest(".next-followup-calendar")) {
                followUpCalendarOpen = false;
                render();
            }
        });

        function updateRowsOnly() {
            const rows = getVisibleRows();
            let body = "";
            for (const x of rows) {
                const id = String(x.id);
                body += "<tr><td><input type='checkbox' class='rowCheck' value='" + esc(id) +
                    "' title='Select " + esc(id) + "' onchange='setRowSelected(this)'" +
                    (selectedIds.has(id) ? " checked" : "") + "></td>" +
                    fields.map(f => "<td>" + esc((f === "leadInDate" || f === "nextFollowUpDate") ? formatDateDDMMYYYY(x[f]) : (x[f] ?? "")) + "</td>").join("") +
                    "<td><button onclick='editLead(" + JSON.stringify(x.id) + ")'>Edit</button> " +
                    "<button class='gray' onclick='deleteLead(" + JSON.stringify(x.id) + ")'>Delete</button></td></tr>";
            }
            const table = document.querySelector("#tableWrap table");
            if (table) {
                const tbody = table.querySelector("tbody");
                if (tbody) tbody.innerHTML = body;
            }
            updateSelectAllState();
        }

        function render() {
            const active = document.activeElement;
            const activeId = active && active.id;
            const activeStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
            const activeEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;
            const rows = getVisibleRows();

            // Remove selections for records that no longer exist.
            const existing = new Set(leads.map(x => String(x.id)));
            [...selectedIds].forEach(id => { if (!existing.has(String(id))) selectedIds.delete(id); });
            // Reconcile selections received from MongoDB. Local selections are kept
            // until the server reflects the same value, so the current checkbox does
            // not flicker while the live update is in flight.
            leads.forEach(x => {
                const id = String(x.id);
                if (x.selected === true) selectedIds.add(id);
                else if (x.selected === false && !pendingSelectionIds.has(id)) selectedIds.delete(id);
            });

            let h = "<table><thead><tr>" +
                "<th style='width:42px'><input type='checkbox' id='selectAll' title='Select all visible rows' onchange='toggleAllRows(this.checked)'></th>" +
                fields.map(f => "<th>" + labels[f] + "</th>").join("") +
                "<th>Actions</th></tr><tr><th></th>" +
                fields.map(f => f === "nextFollowUpDate"
                    ? `<th>${nextFollowUpFilterHtml()}</th>`
                    : `<th><input class="filter" id="filter_${f}" type="${f === "leadInDate" ? "date" : "text"}" value="${esc(filters[f] || "")}" oninput="filters['${f}']=this.value;render()"></th>`
                ).join("") +
                "<th></th></tr></thead><tbody>";

            for (const x of rows) {
                const id = String(x.id);
                h += "<tr><td><input type='checkbox' class='rowCheck' value='" + esc(id) +
                    "' title='Select " + esc(id) + "' onchange='setRowSelected(this)'" +
                    (selectedIds.has(id) ? " checked" : "") + "></td>" +
                    fields.map(f => "<td>" + esc((f === "leadInDate" || f === "nextFollowUpDate") ? formatDateDDMMYYYY(x[f]) : (x[f] ?? "")) + "</td>").join("") +
                    "<td><button onclick='editLead(" + JSON.stringify(x.id) + ")'>Edit</button> " +
                    "<button class='gray' onclick='deleteLead(" + JSON.stringify(x.id) + ")'>Delete</button></td></tr>";
            }
            h += "</tbody></table>";
            document.getElementById("tableWrap").innerHTML = h;

            updateSelectAllState();

            // Re-rendering the table must not steal focus/caret from a filter/search input.
            if (activeId) {
                const restored = document.getElementById(activeId);
                if (restored) {
                    restored.focus();
                    if (activeStart !== null && typeof restored.setSelectionRange === "function" && restored.type !== "date") {
                        try { restored.setSelectionRange(activeStart, activeEnd); } catch (_) {}
                    }
                }
            }
        }

        async function setRowSelected(el) {
            const id = String(el.value);
            const checked = Boolean(el.checked);
            if (checked) selectedIds.add(id);
            else selectedIds.delete(id);
            pendingSelectionIds.add(id);
            updateSelectAllState();
            try {
                await api(API + "/selection", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id, selected: checked })
                });
            } catch (e) {
                if (checked) selectedIds.delete(id);
                else selectedIds.add(id);
                alert("Checkbox sync failed: " + e.message);
            } finally {
                pendingSelectionIds.delete(id);
                updateSelectAllState();
            }
        }

        function updateSelectAllState() {
            const master = document.getElementById("selectAll");
            if (!master) return;
            const visibleIds = getVisibleRows().map(x => String(x.id));
            const selectedVisible = visibleIds.filter(id => selectedIds.has(id)).length;
            master.checked = visibleIds.length > 0 && selectedVisible === visibleIds.length;
            master.indeterminate = selectedVisible > 0 && selectedVisible < visibleIds.length;
        }

        function getSelectedIds() {
            return [...selectedIds];
        }

        async function toggleAllRows(checked) {
            const ids = getVisibleRows().map(x => String(x.id));
            ids.forEach(id => {
                if (checked) selectedIds.add(id);
                else selectedIds.delete(id);
                pendingSelectionIds.add(id);
            });
            render();
            try {
                await api(API + "/selection", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ids, selected: checked })
                });
            } catch (e) {
                ids.forEach(id => {
                    if (checked) selectedIds.delete(id);
                    else selectedIds.add(id);
                });
                alert("Checkbox sync failed: " + e.message);
            } finally {
                ids.forEach(id => pendingSelectionIds.delete(id));
                updateSelectAllState();
            }
        }

        async function deleteSelected() {
            const ids = getSelectedIds();
            if (!ids.length) {
                alert("Please select at least one lead.");
                return;
            }
            if (!confirm("Delete " + ids.length + " selected lead(s)?")) return;
            try {
                for (const id of ids) {
                    await api(API + "/" + encodeURIComponent(id), { method: "DELETE" });
                    selectedIds.delete(String(id));
                }
                await load();
            } catch (e) {
                alert(e.message);
            }
        }
        function dateOnly(v) { const m = String(v ?? "").match(/^(\d{4}-\d{2}-\d{2})/); return m ? m[1] : String(v ?? ""); }
        // Display dates as DD-MM-YYYY while keeping the stored/input value in ISO format.
        function formatDateDDMMYYYY(v) {
            const d = dateOnly(v);
            const m = d.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            return m ? `${m[3]}-${m[2]}-${m[1]}` : d;
        }
        function esc(v) { return String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])) }
        function clearFilters() { filters = {}; document.getElementById("globalSearch").value = ""; render() }
        function openAdd() { editId = null; document.getElementById("modalTitle").textContent = "Add Lead"; buildForm({}); document.getElementById("leadModal").classList.add("show") }
        function editLead(id) { const x = leads.find(a => String(a.id) === String(id)); if (!x) return; editId = id; document.getElementById("modalTitle").textContent = "Edit Lead"; buildForm(x); document.getElementById("leadModal").classList.add("show") }
        function buildForm(x) {
            document.getElementById("form").innerHTML = fields.map(f => {
                const isDate = f === "leadInDate" || f === "nextFollowUpDate";
                return `<label>${labels[f]}<input id="f_${f}" type="${isDate ? "date" : "text"}" value="${esc(isDate ? dateOnly(x[f]) : (x[f] ?? ""))}" ${f === "id" && editId !== null ? "readonly" : ""}></label>`;
            }).join("");
        }
        function closeLead() { document.getElementById("leadModal").classList.remove("show") }
        async function saveLead() { const x = {}; fields.forEach(f => x[f] = document.getElementById("f_" + f).value); if (!x.id) x.id = String(Date.now()); try { await api(editId === null ? API : API + "/" + encodeURIComponent(editId), { method: editId === null ? "POST" : "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(x) }); closeLead(); await load() } catch (e) { alert(e.message) } }
        async function deleteLead(id) { if (!confirm("Delete this lead?")) return; try { await api(API + "/" + encodeURIComponent(id), { method: "DELETE" }); selectedIds.delete(String(id)); await load() } catch (e) { alert(e.message) } }
        function openImport() { document.getElementById("importModal").classList.add("show"); document.getElementById("importMsg").textContent = "" }
        function closeImport() { document.getElementById("importModal").classList.remove("show") }
        async function importFile() { const f = document.getElementById("file").files[0]; if (!f) return alert("Choose a file"); const fd = new FormData(); fd.append("file", f); try { const d = await api(API + "/import", { method: "POST", body: fd }); document.getElementById("importMsg").textContent = `Imported ${d.total} rows: ${d.inserted} added, ${d.updated} updated${d.skippedDuplicateRows ? `, ${d.skippedDuplicateRows} duplicate row(s) merged` : ""}.`; await load() } catch (e) { document.getElementById("importMsg").textContent = e.message } }
        function exportCSV() { const head = fields.join(","); const body = leads.map(x => fields.map(f => { const v = (f === "leadInDate" || f === "nextFollowUpDate") ? formatDateDDMMYYYY(x[f]) : (x[f] ?? ""); return `"${String(v).replaceAll('"', '""')}"`; }).join(",")).join("\n"); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([head + "\n" + body], { type: "text/csv" })); a.download = "leads.csv"; a.click() }
        load();
        startLiveUpdates();
        if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
    </script>
</body>
